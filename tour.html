  <script>
    // 加载提示：程序还没下完时先用这段小脚本显示地点名和轮播提示（tour/loading.js 之后接手进度）
    (function () {
      var L = document.getElementById("loading"), loc = new URLSearchParams(location.search).get("loc");
      var names = { ooku: "大奥", wanya: "万屋", sakai: "坂井家", fuenokouji: "笛小路家", solaris: "そらりす丸", subway: "地下铁", prison: "牢房" }, touch = matchMedia("(pointer: coarse)").matches || /[?&]touch=1/.test(location.search);
      L.querySelector(".where").textContent = loc ? "正在进入「" + (names[loc] || loc) + "」" : "正在展开绘卷";
      if (!touch) L.querySelector(".wifi").remove();
      var tips = touch
        ? ["左下角按住拖动就能走，推到底走得快", "右下角的摇杆转镜头，两根手指缩放", "看到「観」点一下，会走过去打开说明卡", "点「拔剑」，药郎会拔出退魔之剑", "点朱红的「拍照」存图，右上角「滤镜」换夜色、雨、褪色", "右上角「音」可以开关声音"]
        : ["点地面，药郎就走过去；也可以用 WASD，按住 Shift 快走", "看到「観」点一下，会走过去打开说明卡", "拖动转镜头，滚轮拉远拉近", "按 X，药郎会拔出退魔之剑", "P 拍照，F 换滤镜（夜色、雨、褪色），O 换姿势", "右上角「音」或按 B 开关声音"];
      var i = Math.floor(Math.random() * tips.length), el = L.querySelector(".tip");
      function show() { el.style.opacity = 0; setTimeout(function () { el.innerHTML = "<b>小提示</b>" + tips[i++ % tips.length]; el.style.opacity = 1; }, 300); }
      show(); setInterval(show, 4000);
    })();
  </script>
