<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>怪化猫游览</title>
  <style>
    :root { --paper: #F1E9DA; --ink: #322D48; --coral: #E6667A; --crimson: #B42A47; --ochre: #DCC67C; --teal: #49B3A6; --wisteria: #6A4C8C; --navy: #2A2A4E; --lavender: #D6D3EF; }
    html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; font-family: "Hiragino Mincho ProN", "Songti SC", "Noto Serif CJK SC", serif; color: var(--ink); }
    #stage canvas { display: block; touch-action: none; }
    .paper { background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); position: relative; }
    .paper::before { content: ""; position: absolute; inset: 0; background: url(/textures/paper.png) 0 0 / 512px; opacity: .12; mix-blend-mode: multiply; pointer-events: none; }
    .paper > * { position: relative; }
    #status { position: fixed; left: 14px; top: 12px; font: 12px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); opacity: .8; pointer-events: none; text-shadow: 0 0 4px var(--navy); }
    #help { position: fixed; right: 14px; top: 12px; font: 12px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); opacity: .55; text-align: right; pointer-events: none; text-shadow: 0 0 4px var(--navy); }
    #prompt { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); padding: 6px 16px; font-size: 18px; letter-spacing: .1em; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #prompt.show { opacity: 1; }
    #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) translateY(-8px); padding: 8px 16px; font-size: 16px; opacity: 0; transition: all .3s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%); }
    /* 说明卡 */
    #card { position: fixed; left: 50%; bottom: 10%; transform: translateX(-50%) translateY(12px); width: min(620px, 86vw); padding: 18px 26px 22px; opacity: 0; pointer-events: none; transition: all .25s; cursor: pointer; }
    #card.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
    #card .place { display: inline-block; margin: -32px 0 8px -10px; padding: 2px 14px; background: var(--crimson); color: var(--paper); font-size: 14px; letter-spacing: .15em; }
    #card .title { font-size: 24px; letter-spacing: .12em; margin-bottom: 8px; }
    #card .body { font-size: 18px; line-height: 1.75; letter-spacing: .04em; }
    #card::after { content: "E / 点击 关闭"; position: absolute; right: 16px; bottom: 8px; font: 11px -apple-system, "Hiragino Sans GB", sans-serif; opacity: .45; }
    /* 地面标签 */
    #tags { position: fixed; inset: 0; pointer-events: none; }
    .tag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; user-select: none; }
    .tag.view { width: 30px; height: 30px; line-height: 28px; text-align: center; font-size: 17px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); color: var(--crimson); box-shadow: 2px 2px 0 var(--ink); }
    .tag.exit { padding: 3px 12px; font-size: 15px; letter-spacing: .12em; background: var(--crimson); color: var(--paper); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    .tag:hover { filter: brightness(1.08); transform-origin: 50% 100%; }
    #wipe { position: fixed; inset: 0; transform: translateX(-100%); pointer-events: none; z-index: 20;
      background: repeating-linear-gradient(90deg, var(--paper) 0 23%, var(--ink) 23% 23.6%, var(--paper) 23.6% 49.4%, var(--ink) 49.4% 50.6%, var(--paper) 50.6% 76.4%, var(--ink) 76.4% 77%, var(--paper) 77% 100%); }
    /* 拍照滤镜预览（F 切换）：画布本身走 CSS filter，夜色的藍调和雨丝叠在这一层 */
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    #fx.night { background: rgba(42, 42, 78, .35); mix-blend-mode: multiply; }
    #fx.rain { background: repeating-linear-gradient(104deg, transparent 0 22px, rgba(241, 233, 218, .3) 22px 23px, transparent 23px 51px); background-size: 180px 180px; animation: rain .3s linear infinite; }
    @keyframes rain { to { background-position: -40px 180px; } }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
    #flash.go { animation: flash .45s ease-out; }
    @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
    /* 总地图：绘卷长卷（场景线 data/tour/map.json 的图 + 热区），按窗口高度缩放，横着拖看 */
    #map { display: none; position: fixed; inset: 0; background: var(--navy); }
    body.map-mode #map { display: flex; flex-direction: column; justify-content: center; }
    body.map-mode #help { display: none; }
    #map h1 { color: var(--paper); font-weight: normal; letter-spacing: .5em; margin: 0 0 4px 48px; font-size: 26px; }
    #map .hint { color: var(--paper); opacity: .55; margin: 0 0 14px 50px; font: 13px -apple-system, "Hiragino Sans GB", sans-serif; letter-spacing: .08em; }
    #map .scroll { overflow-x: auto; overflow-y: hidden; padding: 10px 0 18px; cursor: grab; scrollbar-width: thin; scrollbar-color: var(--wisteria) transparent; user-select: none; }
    #map .scroll:active { cursor: grabbing; }
    #map .roll { display: flex; align-items: stretch; width: max-content; padding: 0 40px; height: min(72vh, 620px); }
    #map .rod { width: 26px; flex: none; border-radius: 13px; background: linear-gradient(90deg, #3a2a22, #573F33 35%, #7a5a48 50%, #573F33 65%, #3a2a22); border: 2px solid var(--ink); margin: -14px 0; }
    #map .paper-roll { position: relative; height: 100%; flex: none; box-shadow: 0 0 0 3px var(--ink), 6px 8px 0 3px rgba(0,0,0,.35); }
    #map .paper-roll img { display: block; height: 100%; width: 100%; pointer-events: none; -webkit-user-drag: none; }
    #map .spot { position: absolute; }
    #map .spot.locked { background: rgba(241, 233, 218, .5); backdrop-filter: grayscale(1) brightness(1.05); -webkit-backdrop-filter: grayscale(1) brightness(1.05); }
    #map .spot.open { cursor: pointer; border: 3px solid transparent; transition: border-color .15s, background .15s; }
    #map .spot.open:hover { border-color: var(--crimson); background: rgba(231, 163, 181, .12); }
    #map .tag-name { position: absolute; transform: translate(-50%, -10%); display: flex; flex-direction: column; align-items: center; pointer-events: none; transition: transform .15s; }
    #map .tag-name .name { background: var(--paper); border: 2px solid var(--ink); padding: 3px 12px; font-size: clamp(14px, 2.4vh, 22px); letter-spacing: .25em; box-shadow: 3px 3px 0 var(--ink); }
    #map .tag-name.open { pointer-events: auto; cursor: pointer; }
    #map .tag-name.open .name { background: var(--crimson); color: var(--paper); }
    #map .tag-name.hover { transform: translate(-50%, -24%); }
    #map .tag-name .sub { margin-top: 4px; font-size: clamp(10px, 1.5vh, 13px); color: var(--ink); background: rgba(241, 233, 218, .85); padding: 0 6px; letter-spacing: .08em; }
    #map .tag-name .seal { margin-top: 4px; font: 11px -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); background: var(--ink); padding: 1px 8px; }
    #map .tests { position: fixed; right: 16px; bottom: 10px; font: 12px -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); opacity: .45; }
    #map .tests a { color: var(--paper); }
    /* 声音开关：右上角小圆钮，"音" = 开，"静" = 关 */
    #snd { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 10px; z-index: 6; width: 34px; height: 34px; border-radius: 50%; padding: 0; font: 15px/1 "Hiragino Mincho ProN", "Songti SC", serif; background: var(--paper); color: var(--crimson); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #snd.off { color: var(--ink); opacity: .6; }
    #help { right: 58px !important; }
    body.touch #help .keys { display: none; }
    body:not(.touch) #help .fingers { display: none; }
    /* 手机（body.touch）操作，像手游（11-03 用户："左边摇杆控制方向，右边是一些按键"）：
       左下摇杆区（左 45% 宽、下 60% 高）：手指按到哪摇杆就出现在哪，推一点走、推到底快走；只点一下不拖还是"点地面走"。
       右下角视角摇杆（11-03 用户："看"改成视角的遥控台）：推哪边镜头往哪边转，推得越多转得越快，松手停；
       左边朱红大圆"拍照"，上方弧形排拔剑、姿势；用得少的滤镜、地图放右上角"音"旁边。右半屏拖动转镜头、两指缩放照旧。
       看说明卡：点画面里的"観"、或走到旁边点提示条。电脑版不显示这些（键盘鼠标） */
    #pad, #stick, #look { display: none; }
    body.touch #pad { display: block; }
    body.touch.map-mode #pad, body.touch.map-mode #stick, body.touch.map-mode #look { display: none; }
    #pad button { position: fixed; z-index: 5; font: 14px/1 "Hiragino Mincho ProN", "Songti SC", serif; letter-spacing: .04em; white-space: nowrap; padding: 0; border-radius: 50%; width: 54px; height: 54px; background: rgba(241, 233, 218, .92); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: opacity .2s; }
    #pad button:active { transform: translate(2px, 2px); box-shadow: none; }
    #pad .b-photo { width: 66px; height: 66px; font-size: 17px; right: calc(150px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); background: var(--crimson); color: var(--paper); }
    #pad .b-sword { right: calc(138px + env(safe-area-inset-right)); bottom: calc(110px + env(safe-area-inset-bottom)); }
    #pad .b-pose { right: calc(66px + env(safe-area-inset-right)); bottom: calc(150px + env(safe-area-inset-bottom)); }
    /* 视角摇杆：固定在右下角，底座 120 像素，手柄跟着手指，最多推出 46 像素 */
    body.touch #look { display: block; position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 120px; height: 120px; z-index: 5; touch-action: none; border-radius: 50%; border: 2px solid rgba(241, 233, 218, .75); background: rgba(42, 42, 78, .25); opacity: .75; transition: opacity .2s; }
    body.touch #look.on { opacity: 1; transition: none; }
    #look .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(241, 233, 218, .95); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); pointer-events: none; display: flex; align-items: center; justify-content: center; font: 13px/1 "Hiragino Mincho ProN", "Songti SC", serif; color: var(--ink); }
    #pad .b-filter, #pad .b-map { width: auto; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; top: 12px; }
    #pad .b-map { right: calc(56px + env(safe-area-inset-right)); }
    #pad .b-filter { right: calc(116px + env(safe-area-inset-right)); }
    body.touch #stick { display: block; position: fixed; left: 0; bottom: 0; width: 45vw; height: 60vh; z-index: 3; touch-action: none; }
    #stick .base { position: absolute; left: calc(28px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(241, 233, 218, .75); background: rgba(42, 42, 78, .25); transition: opacity .2s; opacity: .7; pointer-events: none; }
    #stick.on .base { opacity: 1; transition: none; }
    #stick .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(241, 233, 218, .95); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    body.touch #tags { z-index: 4; }
    body.touch #help { right: calc(180px + env(safe-area-inset-right)) !important; }
    @media (orientation: portrait) { body.touch #help { top: 48px; left: 14px; right: 14px !important; text-align: left; } }
    body.touch #prompt { pointer-events: auto; cursor: pointer; bottom: calc(190px + env(safe-area-inset-bottom)); }
    body.touch #card { bottom: calc(190px + env(safe-area-inset-bottom)); width: 90vw; padding: 14px 18px 18px; }
    @media (orientation: landscape) {
      body.touch #card { bottom: 6% !important; width: min(560px, calc(100vw - 380px)) !important; }
      body.touch #prompt { bottom: 6% !important; }
    }
    body.touch #card .title { font-size: 20px; }
    body.touch #card .body { font-size: 16px; }
    body.touch #card::after { content: "点击关闭"; }
    body.touch .tag.view { width: 38px; height: 38px; line-height: 36px; font-size: 20px; }
    body.touch .tag.exit { padding: 6px 14px; font-size: 16px; }
    #map .scroll { touch-action: pan-x; -webkit-overflow-scrolling: touch; }
    /* 首次加载提示（tour/loading.js 接手进度）：纸色卡片、细进度条、轮播小提示；静态写在这里，程序没下完也能显示 */
    #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--navy); transition: opacity .5s; padding: 16px; box-sizing: border-box; }
    #loading.out { opacity: 0; pointer-events: none; }
    #loading .card { width: min(440px, 100%); padding: 22px 24px 18px; text-align: left; }
    #loading h1 { margin: 0 0 2px; font-weight: normal; font-size: 22px; letter-spacing: .4em; }
    #loading .where { font-size: 15px; letter-spacing: .1em; margin-bottom: 14px; color: var(--crimson); }
    #loading .bar { height: 6px; background: rgba(50, 45, 72, .15); border: 1px solid var(--ink); overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 0; background: var(--crimson); transition: width .3s; }
    #loading:not(.counting) .bar i { width: 30%; animation: loadslide 1.4s ease-in-out infinite; }
    @keyframes loadslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    #loading .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font: 12px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; opacity: .7; }
    #loading .big, #loading .note { font: 13px/1.7 -apple-system, "Hiragino Sans GB", sans-serif; margin-top: 12px; }
    #loading .big:empty { display: none; }
    #loading .tip { margin-top: 14px; padding-top: 10px; border-top: 1px dashed rgba(50, 45, 72, .35); font-size: 14px; line-height: 1.7; min-height: 2.4em; transition: opacity .3s; }
    #loading .tip b { color: var(--crimson); font-weight: normal; margin-right: 6px; }
    #loading.failed .bar, #loading.failed .tip, #loading.failed .meta { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="status"></div>
  <div id="loading"><div class="card paper">
    <h1>怪化猫 · 游览</h1>
    <div class="where">正在加载</div>
    <div class="bar"><i></i></div>
    <div class="meta"><span class="step">准备中…</span><span class="mb"></span></div>
    <div class="big"></div>
    <div class="note">第一次进入要准备场景和人物，稍等片刻；之后再来会快很多。<span class="wifi">手机建议连 Wi-Fi。</span></div>
    <div class="tip"></div>
  </div></div>
  <script>
    // 加载提示：程序还没下完时先用这段小脚本显示地点名和轮播提示（tour/loading.js 之后接手进度）
    (function () {
      var L = document.getElementById("loading"), loc = new URLSearchParams(location.search).get("loc");
      var names = { ooku: "大奥", wanya: "万屋", sakai: "坂井家" }, touch = matchMedia("(pointer: coarse)").matches || /[?&]touch=1/.test(location.search);
      L.querySelector(".where").textContent = loc ? "正在进入「" + (names[loc] || loc) + "」" : "正在展开绘卷";
      if (!touch) L.querySelector(".wifi").remove();
      var tips = touch
        ? ["左下角按住拖动就能走，推到底走得快", "走到「観」旁边，点右下红色的「看」打开说明卡", "右半边屏幕拖动转镜头，两根手指缩放", "点「拔剑」，药郎会拔出退魔之剑", "点「拍照」存图，右上角「滤镜」换夜色、雨、褪色", "右上角「音」可以开关声音"]
        : ["点地面，药郎就走过去；也可以用 WASD，按住 Shift 快走", "看到「観」点一下，会走过去打开说明卡", "拖动转镜头，滚轮拉远拉近", "按 X，药郎会拔出退魔之剑", "P 拍照，F 换滤镜（夜色、雨、褪色），O 换姿势", "右上角「音」或按 B 开关声音"];
      var i = Math.floor(Math.random() * tips.length), el = L.querySelector(".tip");
      function show() { el.style.opacity = 0; setTimeout(function () { el.innerHTML = "<b>小提示</b>" + tips[i++ % tips.length]; el.style.opacity = 1; }, 300); }
      show(); setInterval(show, 4000);
    })();
  </script>
  <button id="snd" title="声音开关（B）">音</button>
  <div id="help"><span class="keys">点地面走 · 拖动转镜头 · 滚轮远近 · E 看说明 · P 拍照 · F 换滤镜 · O 换姿势 · X 拔剑 · M 总地图 · B 声音</span><span class="fingers">左边摇杆走路 · 右边摇杆转视角 · 两指缩放</span></div>
  <div id="look"><div class="knob">视角</div></div>
  <div id="pad"><button class="b-sword" data-k="KeyX">拔剑</button><button class="b-photo" data-k="KeyP">拍照</button><button class="b-pose" data-k="KeyO">姿势</button><button class="b-filter" data-k="KeyF">滤镜</button><button class="b-map" data-k="KeyM">地图</button></div>
  <div id="stick"><div class="base"><div class="knob"></div></div></div>
  <div id="fx"></div>
  <div id="tags"></div>
  <div id="prompt" class="paper"></div>
  <div id="toast" class="paper"></div>
  <div id="card" class="paper"><div class="place"></div><div class="title"></div><div class="body"></div></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div id="map"><h1>怪化猫 · 游览</h1><div class="hint">拖动或滚轮看长卷，点亮着的地点进去</div><div class="scroll"><div class="roll"><div class="rod"></div><div class="paper-roll"><img alt="绘卷总地图"></div><div class="rod"></div></div></div><div class="tests"></div></div>
  <!-- 访问统计（GoatCounter，duami.goatcounter.com）：不用 cookie；页面路径由 tour.js 自己报（no_onload），开发时（localhost）不报 -->
  <script data-goatcounter="https://duami.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="https://gc.zgo.at/count.js"></script>
  <script type="module" src="/src/tour/tour.js"></script>
</body>
</html>
