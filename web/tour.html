<!doctype html>
<html lang="zh">
<head>
  <script>window.__TEX_JPG = []; window.__BUILD = "";</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>怪化猫游览</title>
  <style>
    :root { --paper: #F1E9DA; --ink: #322D48; --coral: #E6667A; --crimson: #B42A47; --ochre: #DCC67C; --teal: #49B3A6; --wisteria: #6A4C8C; --navy: #2A2A4E; --lavender: #D6D3EF; }
    html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; font-family: "Hiragino Mincho ProN", "Songti SC", "Noto Serif CJK SC", serif; color: var(--ink); }
    #stage canvas { display: block; touch-action: none; }
    .paper { background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); position: relative; }
    .paper::before { content: ""; position: absolute; inset: 0; background: url(/textures/paper.jpg) 0 0 / 512px; opacity: .12; mix-blend-mode: multiply; pointer-events: none; }
    .paper > * { position: relative; }
    #status { position: fixed; left: 14px; top: 12px; font: 12px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); opacity: .8; pointer-events: none; text-shadow: 0 0 4px var(--navy); }
    #help { position: fixed; right: 14px; top: 12px; font: 12px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); opacity: .55; text-align: right; pointer-events: none; text-shadow: 0 0 4px var(--navy); }
    #prompt { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); padding: 6px 16px; font-size: 18px; letter-spacing: .1em; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #prompt.show { opacity: 1; }
    #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) translateY(-8px); padding: 8px 16px; font-size: 16px; opacity: 0; transition: all .3s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%); }
    /* 说明卡 */
    #card { position: fixed; left: 50%; bottom: 10%; transform: translateX(-50%) translateY(12px); width: min(620px, 86vw); padding: 18px 26px 22px; opacity: 0; pointer-events: none; transition: all .25s; cursor: pointer; }
    #card.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
    #card .place { display: inline-block; margin: -32px 0 8px -10px; padding: 2px 14px; background: var(--crimson); color: var(--paper); font-size: 14px; letter-spacing: .15em; }
    #card .title { font-size: 24px; letter-spacing: .12em; margin-bottom: 8px; }
    #card .body { font-size: 18px; line-height: 1.75; letter-spacing: .04em; }
    #card::after { content: "E / 点击 关闭"; position: absolute; right: 16px; bottom: 8px; font: 11px -apple-system, "Hiragino Sans GB", sans-serif; opacity: .45; }
    /* 地面标签 */
    #tags { position: fixed; inset: 0; pointer-events: none; }
    .tag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; user-select: none; }
    .tag.view { width: 30px; height: 30px; line-height: 28px; text-align: center; font-size: 17px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); color: var(--crimson); box-shadow: 2px 2px 0 var(--ink); }
    .tag.exit { padding: 3px 12px; font-size: 15px; letter-spacing: .12em; background: var(--crimson); color: var(--paper); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    .tag:hover { filter: brightness(1.08); transform-origin: 50% 100%; }
    #wipe { position: fixed; inset: 0; transform: translateX(-100%); pointer-events: none; z-index: 20;
      background: repeating-linear-gradient(90deg, var(--paper) 0 23%, var(--ink) 23% 23.6%, var(--paper) 23.6% 49.4%, var(--ink) 49.4% 50.6%, var(--paper) 50.6% 76.4%, var(--ink) 76.4% 77%, var(--paper) 77% 100%); }
    #wipe::after { content: "正在布置下一间…"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 18px; font-size: 16px; letter-spacing: .25em; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); opacity: 0; transition: opacity .3s; white-space: nowrap; }
    #wipe.wait::after { opacity: 1; }
    /* 拍照滤镜预览（F 切换）：画布本身走 CSS filter，夜色的藍调和雨丝叠在这一层 */
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    #fx.night { background: rgba(42, 42, 78, .35); mix-blend-mode: multiply; }
    #fx.rain { background: repeating-linear-gradient(104deg, transparent 0 22px, rgba(241, 233, 218, .3) 22px 23px, transparent 23px 51px); background-size: 180px 180px; animation: rain .3s linear infinite; }
    @keyframes rain { to { background-position: -40px 180px; } }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
    #flash.go { animation: flash .45s ease-out; }
    @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
    /* 总地图：绘卷长卷（场景线 data/tour/map.json 的图 + 热区），按窗口高度缩放，横着拖看 */
    #map { display: none; position: fixed; inset: 0; background: var(--navy); }
    body.map-mode #map { display: flex; flex-direction: column; justify-content: center; }
    body.map-mode #help { display: none; }
    #map h1 { color: var(--paper); font-weight: normal; letter-spacing: .5em; margin: 0 0 4px 48px; font-size: 26px; }
    #map .intro-btn { margin-left: 18px; vertical-align: middle; background: transparent; border: 1px solid rgba(241,233,218,.45); color: var(--paper); font: 13px -apple-system, "PingFang SC", sans-serif; letter-spacing: .2em; padding: 4px 10px 4px 12px; cursor: pointer; opacity: .75; }
    #map .intro-btn:hover { opacity: 1; }
    #map .hint { color: var(--paper); opacity: .55; margin: 0 0 14px 50px; font: 13px -apple-system, "Hiragino Sans GB", sans-serif; letter-spacing: .08em; }
    #map .scroll { overflow-x: auto; overflow-y: hidden; padding: 10px 0 18px; cursor: grab; scrollbar-width: thin; scrollbar-color: var(--wisteria) transparent; user-select: none; }
    #map .scroll:active { cursor: grabbing; }
    #map .roll { display: flex; align-items: stretch; width: max-content; padding: 0 40px; height: min(72vh, 620px); }
    #map .rod { width: 26px; flex: none; border-radius: 13px; background: linear-gradient(90deg, #3a2a22, #573F33 35%, #7a5a48 50%, #573F33 65%, #3a2a22); border: 2px solid var(--ink); margin: -14px 0; }
    #map .paper-roll { position: relative; height: 100%; flex: none; box-shadow: 0 0 0 3px var(--ink), 6px 8px 0 3px rgba(0,0,0,.35); }
    #map .paper-roll img { display: block; height: 100%; width: 100%; pointer-events: none; -webkit-user-drag: none; }
    #map .spot { position: absolute; }
    #map .spot.locked { background: rgba(241, 233, 218, .5); backdrop-filter: grayscale(1) brightness(1.05); -webkit-backdrop-filter: grayscale(1) brightness(1.05); }
    #map .spot.open { cursor: pointer; border: 3px solid transparent; transition: border-color .15s, background .15s; }
    #map .spot.open:hover { border-color: var(--crimson); background: rgba(231, 163, 181, .12); }
    #map .tag-name { position: absolute; transform: translate(-50%, -10%); display: flex; flex-direction: column; align-items: center; pointer-events: none; transition: transform .15s; }
    #map .tag-name .name { background: var(--paper); border: 2px solid var(--ink); padding: 3px 12px; font-size: clamp(14px, 2.4vh, 22px); letter-spacing: .25em; box-shadow: 3px 3px 0 var(--ink); }
    #map .tag-name.open { pointer-events: auto; cursor: pointer; }
    #map .tag-name.open .name { background: var(--crimson); color: var(--paper); }
    #map .tag-name.hover { transform: translate(-50%, -24%); }
    #map .tag-name .sub { margin-top: 4px; font-size: clamp(10px, 1.5vh, 13px); color: var(--ink); background: rgba(241, 233, 218, .85); padding: 0 6px; letter-spacing: .08em; }
    #map .tag-name .seal { margin-top: 4px; font: 11px -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); background: var(--ink); padding: 1px 8px; }
    #map .tests { position: fixed; right: 16px; bottom: 10px; font: 12px -apple-system, "Hiragino Sans GB", sans-serif; color: var(--paper); opacity: .45; }
    #map .tests a { color: var(--paper); }
    /* 声音开关：右上角小圆钮，"音" = 开，"静" = 关 */
    #snd { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 10px; z-index: 6; width: 34px; height: 34px; border-radius: 50%; padding: 0; font: 15px/1 "Hiragino Mincho ProN", "Songti SC", serif; background: var(--paper); color: var(--crimson); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #snd.off { color: var(--ink); opacity: .6; }
    body.touch #help .keys { display: none; }
    body:not(.touch) #help .fingers { display: none; }
    /* 手机（body.touch）操作，像手游（11-03 用户："左边摇杆控制方向，右边是一些按键"）：
       左下摇杆区（左 45% 宽、下 60% 高）：手指按到哪摇杆就出现在哪，推一点走、推到底快走；只点一下不拖还是"点地面走"。
       右下角视角摇杆（11-03 用户："看"改成视角的遥控台）：推哪边镜头往哪边转，推得越多转得越快，松手停；
       左边朱红大圆"拍照"，上方弧形排拔剑、姿势；用得少的滤镜、地图放右上角"音"旁边。右半屏拖动转镜头、两指缩放照旧。
       看说明卡：点画面里的"観"、或走到旁边点提示条。电脑版不显示这些（键盘鼠标） */
    #pad, #stick, #look { display: none; }
    body.touch #pad { display: block; }
    body.touch.map-mode #pad, body.touch.map-mode #stick, body.touch.map-mode #look { display: none; }
    #pad button { position: fixed; z-index: 5; font: 14px/1 "Hiragino Mincho ProN", "Songti SC", serif; letter-spacing: .04em; white-space: nowrap; padding: 0; border-radius: 50%; width: 54px; height: 54px; background: rgba(241, 233, 218, .92); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: opacity .2s; }
    #pad button:active { transform: translate(2px, 2px); box-shadow: none; }
    #pad .b-photo { width: 66px; height: 66px; font-size: 17px; right: calc(150px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); background: var(--crimson); color: var(--paper); }
    #pad .b-sword { right: calc(138px + env(safe-area-inset-right)); bottom: calc(110px + env(safe-area-inset-bottom)); }
    #pad .b-pose { right: calc(66px + env(safe-area-inset-right)); bottom: calc(150px + env(safe-area-inset-bottom)); }
    /* 放天秤（11-06）：姿势钮右边；物怪出没时让给"跳"，放完歇 8 秒变淡 */
    #pad .b-scale { font-size: 18px; right: calc(8px + env(safe-area-inset-right)); bottom: calc(150px + env(safe-area-inset-bottom)); }
    body.touch.encounter #pad .b-scale { display: none; }
    body.cast-cd #pad .b-scale { opacity: .4; }
    /* 视角摇杆：固定在右下角，底座 120 像素，手柄跟着手指，最多推出 46 像素 */
    body.touch #look { display: block; position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 120px; height: 120px; z-index: 5; touch-action: none; border-radius: 50%; border: 2px solid rgba(241, 233, 218, .75); background: rgba(42, 42, 78, .25); opacity: .75; transition: opacity .2s; }
    body.touch #look.on { opacity: 1; transition: none; }
    #look .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(241, 233, 218, .95); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); pointer-events: none; display: flex; align-items: center; justify-content: center; font: 13px/1 "Hiragino Mincho ProN", "Songti SC", serif; color: var(--ink); }
    #pad .b-filter, #pad .b-map { width: auto; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; top: 12px; }
    #pad .b-map { right: calc(73px + env(safe-area-inset-right)); }
    #pad .b-filter { right: calc(139px + env(safe-area-inset-right)); }
    body.touch #stick { display: block; position: fixed; left: 0; bottom: 0; width: 45vw; height: 60vh; z-index: 3; touch-action: none; }
    #stick .base { position: absolute; left: calc(28px + env(safe-area-inset-left)); bottom: calc(28px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(241, 233, 218, .75); background: rgba(42, 42, 78, .25); transition: opacity .2s; opacity: .7; pointer-events: none; }
    #stick.on .base { opacity: 1; transition: none; }
    #stick .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(241, 233, 218, .95); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    body.touch #tags { z-index: 4; }
    body.touch #prompt { pointer-events: auto; cursor: pointer; bottom: calc(190px + env(safe-area-inset-bottom)); }
    body.touch #card { bottom: calc(190px + env(safe-area-inset-bottom)); width: 90vw; padding: 14px 18px 18px; }
    @media (orientation: landscape) {
      body.touch #card { bottom: 6% !important; width: min(560px, calc(100vw - 380px)) !important; }
      body.touch #prompt { bottom: 6% !important; }
    }
    body.touch #card .title { font-size: 20px; }
    body.touch #card .body { font-size: 16px; }
    body.touch #card::after { content: "点击关闭"; }
    body.touch .tag.view { width: 38px; height: 38px; line-height: 36px; font-size: 20px; }
    body.touch .tag.exit { padding: 6px 14px; font-size: 16px; }
    #map .scroll { touch-action: pan-x; -webkit-overflow-scrolling: touch; }
    /* 首次加载提示（tour/loading.js 接手进度）：纸色卡片、细进度条、轮播小提示；静态写在这里，程序没下完也能显示 */
    #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--navy); transition: opacity .5s; padding: 16px; box-sizing: border-box; }
    #loading.out { opacity: 0; pointer-events: none; }
    #loading .card { width: min(440px, 100%); padding: 22px 24px 18px; text-align: left; }
    #loading h1 { margin: 0 0 2px; font-weight: normal; font-size: 22px; letter-spacing: .4em; }
    #loading .where { font-size: 15px; letter-spacing: .1em; margin-bottom: 14px; color: var(--crimson); }
    #loading .bar { height: 6px; background: rgba(50, 45, 72, .15); border: 1px solid var(--ink); overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 0; background: var(--crimson); transition: width .3s; }
    #loading:not(.counting) .bar i { width: 30%; animation: loadslide 1.4s ease-in-out infinite; }
    @keyframes loadslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    #loading .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font: 12px/1.6 -apple-system, "Hiragino Sans GB", sans-serif; opacity: .7; }
    #loading .big, #loading .note { font: 13px/1.7 -apple-system, "Hiragino Sans GB", sans-serif; margin-top: 12px; }
    #loading .big:empty { display: none; }
    #loading .tip { margin-top: 14px; padding-top: 10px; border-top: 1px dashed rgba(50, 45, 72, .35); font-size: 14px; line-height: 1.7; min-height: 2.4em; transition: opacity .3s; }
    #loading .tip b { color: var(--crimson); font-weight: normal; margin-right: 6px; }
    #loading.failed .bar, #loading.failed .tip, #loading.failed .meta { display: none; }
    /* 进门前的铺垫（loading.js prelude）：几页故事 + 小图，读的时候后台在下场景 */
    #loading.has-pre .card { width: min(520px, 100%); }
    #loading.has-pre .tip, #loading.has-pre .note, #loading.has-pre .big { display: none; }
    #loading .pre { cursor: pointer; user-select: none; -webkit-user-select: none; }
    #loading .pimg { aspect-ratio: 16 / 9; background: rgba(50, 45, 72, .12); border: 1px solid var(--ink); overflow: hidden; margin-bottom: 12px; }
    #loading .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.25) saturate(.9); }
    #loading .pt { font-size: 18px; letter-spacing: .15em; margin-bottom: 6px; }
    #loading .pb { font-size: 15px; line-height: 1.9; min-height: 5.7em; }
    #loading .pnav { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 14px; }
    #loading .pd { font-size: 10px; letter-spacing: .3em; opacity: .6; }
    #loading .pgo { padding: 7px 18px; font: 15px serif; color: #fff; background: var(--crimson); border: 0; border-radius: 3px; cursor: pointer; }
    #loading .pgo:disabled { background: rgba(50, 45, 72, .35); cursor: default; }
    #loading .pskip { display: block; margin: 10px auto 0; padding: 4px 10px; font: 12px -apple-system, sans-serif; color: var(--ink); background: none; border: 0; opacity: .6; text-decoration: underline; cursor: pointer; }
    #loading.pre-ready .bar i { background: #6E8F5E; }
    /* 物怪出没（encounter.js）："怪"开关在"音"下面；遭遇时屋角渗墨（#mkink），形真理的字浮在物怪头上、一句话在下方（#mk）；
       手机遭遇时多"札"（占拍照的大圆位置）、"闪"（占姿势的位置）、"跳"（闪右边）、"瞬"（拔剑上面），拍照挪到右上角，形真理齐了拔剑钮发亮 */
    #mkbtn { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 50px; z-index: 6; width: 34px; height: 34px; border-radius: 50%; padding: 0; font: 15px/1 "Hiragino Mincho ProN", "Songti SC", serif; background: var(--paper); color: var(--crimson); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #mkbtn.off { color: var(--ink); opacity: .6; text-decoration: line-through; }
    body.map-mode #mkbtn { display: none; }
    /* 药箱（medbox.js）：收集册子。"箱"钮在"怪"下面；打开时整屏压暗，中间一只大黑漆箱子 4×3 抽屉；点抽屉在上面弹卡 */
    #boxbtn { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 90px; z-index: 6; width: 34px; height: 34px; border-radius: 50%; padding: 0; font: 15px/1 "Hiragino Mincho ProN", "Songti SC", serif; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #boxbtn.new::after { content: ""; position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--crimson); border: 1.5px solid var(--paper); }
    body.map-mode #boxbtn { display: none; }
    /* 抽屉宽按屏幕宽、高里小的那个算（一只箱子占满大半屏，11-04 用户要"先显示药箱的大图"），卡宽 --tw */
    #medbox { --cols: 4; --rows: 3; --dw: max(56px, min(calc((100vw - 70px) / (var(--cols) + .3)), calc((100vh - 140px) / (var(--rows) - .1)), 210px)); --tw: min(580px, 92vw);
      position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; gap: 22px; padding: 16px; background: rgba(20, 16, 31, .62); font-family: "Hiragino Mincho ProN", "Songti SC", serif; }
    #medbox.show { display: flex; }
    #medbox .mb-box { position: relative; background: #1B1622; padding: 34px 14px 14px; border: 3px solid #0d0a12; box-shadow: 5px 5px 0 #0d0a12; flex: none; }
    #medbox .mb-box::before { content: "藥"; position: absolute; left: 50%; top: -20px; transform: translateX(-50%); width: 38px; height: 38px; display: grid; place-items: center; background: var(--crimson); color: var(--paper); border: 2px solid #C9A23A; font-size: 20px; }
    #medbox .mb-count { position: absolute; left: 16px; top: 9px; color: #C9A23A; font-size: 13px; letter-spacing: .12em; }
    #medbox .mb-x { position: absolute; right: 8px; top: 4px; border: 0; background: none; color: #C9A23A; font: 22px/1 serif; cursor: pointer; padding: 2px 6px; }
    #medbox .mb-grid { display: grid; grid-template-columns: repeat(var(--cols), var(--dw)); gap: calc(var(--dw) * .08); }
    #medbox .mb-dr { position: relative; height: calc(var(--dw) * .86); padding: 0; background: linear-gradient(#2c2433, #211a28); border: 2px solid #8a6d26; cursor: pointer; font: inherit; transition: transform .18s, box-shadow .18s; -webkit-tap-highlight-color: transparent; }
    #medbox .mb-dr::before { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(201, 162, 58, .35); background: radial-gradient(circle at 50% 50%, rgba(201, 162, 58, .18) 1px, transparent 1.5px) 0 0 / 9px 9px; pointer-events: none; }
    #medbox .mb-dr .lbl { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); writing-mode: vertical-rl; white-space: nowrap; background: var(--paper); color: var(--ink); padding: 3px 2px; font-size: calc(var(--dw) * .115); line-height: 1.05; min-height: calc(var(--dw) * .48); border: 1px solid #b9a98a; }   /* 六个字（褪色的红手鞠）也要在拉环上面收住 */
    #medbox .mb-dr .new { position: absolute; left: calc(50% + 8px); top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--crimson); border: 1px solid var(--paper); }
    #medbox .mb-dr .lbl { z-index: 1; }   /* 签条长了就盖住拉环，不让拉环横穿字 */

  #medbox .book .C-stamp { position: absolute; right: 6px; top: 6px; z-index: 2; color: var(--crimson); border: 2px solid var(--crimson); background: rgba(241,233,218,.92); font-size: 12px; padding: 0 4px; transform: rotate(9deg); letter-spacing: .12em; }
  #medbox .book .C-left { position: absolute; right: 6px; top: 6px; z-index: 2; background: var(--coral); color: var(--paper); font-size: 11.5px; padding: 1px 6px; letter-spacing: .1em; box-shadow: 1px 1px 0 var(--ink); }
  #medbox .book .C-here { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 3; width: 30px; height: 30px; border-radius: 50%; background: var(--wisteria); color: var(--paper); display: grid; place-items: center; font-size: 13px;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); animation: chere 1.8s ease-in-out infinite; }
  @keyframes chere { 50% { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink), 0 0 0 12px rgba(106,76,140,.35); } }
  #medbox .book .C-deco { position: relative; overflow: hidden; border-radius: 6px; }
  #medbox .book .C-deco .tex { position: absolute; inset: 0; background-size: 70px; opacity: .75; }
  #medbox .book .C-deco span { position: absolute; left: 6px; top: 4px; font-size: 12px; color: var(--mute); letter-spacing: .2em; }
  #medbox .book .C-side { background: var(--navy); border-left: 3px solid var(--ink); display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 30px 0 18px; position: relative; }
  #medbox .book .C-side .hd { position: absolute; top: 8px; color: var(--gold); font-size: 12px; letter-spacing: .3em; }
  #medbox .book .C-node { width: 62px; height: 96px; background: var(--paper); border: 3px solid #a79a87; color: #706452; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-family: inherit; font-size: 34px; line-height: 1; cursor: pointer; position: relative; padding: 0; transition: transform .15s; }
  #medbox .book .C-node::before { content: ""; position: absolute; inset: 4px; border: 1px solid currentColor; opacity: .5; pointer-events: none; }
  #medbox .book .C-node .n { font-size: 11px; letter-spacing: .1em; }
  #medbox .book .C-node.lit { background: var(--cc); color: var(--paper); border-color: var(--gold); box-shadow: 0 0 18px rgba(201,162,58,.55); }
  #medbox .book .C-node.held { color: var(--cc); border: 3px dashed var(--cc); }
  #medbox .book .C-node.on { transform: translateX(-6px); outline: 2px solid var(--gold); outline-offset: 4px; }
  #medbox .book .C-sword { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #c0b6cc; font-size: 11px; letter-spacing: .25em; }
  #medbox .book .C-sword svg { width: 26px; height: 96px; }
  #medbox .book .C-sword.on { color: var(--gold); filter: drop-shadow(0 0 6px rgba(201,162,58,.8)); }
  #medbox .book .C-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }
  #medbox .book .C-svg .th { fill: none; stroke-linecap: round; transition: opacity .2s; }
  #medbox .book .C-svg .dim { opacity: .1; }
  #medbox .book .C-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--mute); }
  #medbox .book .C-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--ink); }
  #medbox .book .C-notes { background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #medbox .book .C-tabs { display: flex; border-bottom: 2px solid var(--ink); overflow-x: auto; }
  #medbox .book .C-tabs button { font: inherit; font-size: 14px; letter-spacing: .12em; border: 0; border-right: 1px solid rgba(50,45,72,.25); background: none; color: var(--mute); padding: 6px 14px; cursor: pointer; white-space: nowrap; }
  #medbox .book .C-tabs > b { padding: 6px 14px; align-self: center; }
  #medbox .book .C-tabs button.on { background: var(--ink); color: var(--paper); }
  #medbox .book .C-body { padding: 10px 16px 14px; }
  #medbox .book .C-body .ln { font-size: 16px; padding: 2px 0 8px; border-bottom: 1px dotted #b9a98a; margin-bottom: 6px; }
  #medbox .book .C-body .ln.lit { color: var(--crimson); }
  #medbox .book .C-body .ln.held { color: var(--coral); }
  #medbox .book .C-body .ln.none { color: #6a6079; }
  #medbox .book .C-body ul { list-style: none; margin: 0; padding: 0; }
  #medbox .book .C-body li { display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; padding: 5px 4px; font-size: 14.5px; line-height: 1.55; border-radius: 2px; }
  #medbox .book .C-body li .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--pc, var(--paper)); color: var(--paper); border: 2px solid var(--ink); grid-row: span 2; }
  #medbox .book .C-body li .ic.s { background: var(--paper); color: var(--ink); } #medbox .book .C-body li .ic.f { background: var(--gold); border-radius: 3px; }
  #medbox .book .C-body li small { color: var(--mute); font-size: 12px; letter-spacing: .06em; }
  #medbox .book .C-body li.un { color: #b8b0c2; letter-spacing: .3em; }
  #medbox .book .C-body li.un .ic { background: none; border: 2px dashed #c9bfae; }
  #medbox .book .C-body li.sel { background: rgba(201,162,58,.18); }
  
@media (max-width: 700px) {
    #medbox .book .C-wrap { grid-template-columns: 1fr; }
    #medbox .book .C-plan { --room-height: 64px; gap: 6px; padding: 50px 10px 12px; }
    #medbox .book .C-plan .compass { top: 27px; left: 18px; right: auto; }
    #medbox .book .C-side { flex-direction: row; justify-content: center; border-left: 0; border-top: 3px solid var(--ink); padding: 26px 8px 12px; gap: 14px; }
    #medbox .book .C-node { width: 54px; height: 72px; font-size: 26px; }
    #medbox .book .C-sword { margin: 0 0 0 6px; } #medbox .book .C-sword svg { height: 64px; }
    #medbox .book .C-pin { width: 22px; height: 22px; font-size: 10px; }
    #medbox .book .C-room .nm { font-size: 12px; }
  }
    #map .tag-name .prog { display: block; margin-top: 3px; font-size: 11px; letter-spacing: .05em; color: var(--crimson); }
    /* 语言设置（文案w，i18n.js）：总地图右上「设」，在「音」左边 */
    #setbtn { position: fixed; right: calc(max(12px, env(safe-area-inset-right)) + 64px); top: 10px; z-index: 6; width: 34px; height: 34px; border-radius: 50%; padding: 0; font: 15px/1 "Hiragino Mincho ProN", "Songti SC", serif; background: var(--paper); color: var(--crimson); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #setpanel { display: none; position: fixed; right: max(12px, env(safe-area-inset-right)); top: 52px; z-index: 7; padding: 10px 12px 12px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); min-width: 168px; }
    #setpanel.open { display: block; }
    #setpanel .hd { font: 12px -apple-system, "Hiragino Sans GB", sans-serif; letter-spacing: .06em; opacity: .7; margin-bottom: 8px; }
    #setpanel button { display: block; width: 100%; margin-top: 6px; padding: 7px 10px; text-align: left; font: 15px "Hiragino Mincho ProN", "Songti SC", serif; background: transparent; color: var(--ink); border: 2px solid var(--ink); cursor: pointer; }
    #setpanel button.on { background: var(--crimson); color: var(--paper); }
    body.lang-en #card::after { content: "E / click to close"; }
    body.lang-ja #card::after { content: "E / クリックで閉じる"; }
    body.touch.lang-en #card::after { content: "tap to close"; }
    body.touch.lang-ja #card::after { content: "押して閉じる"; }

    body.lang-ja #wipe::after { content: "次の間をしつらえている…"; }
    body.lang-en #map h1 { letter-spacing: .2em; }
    body.lang-ja { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif; }
    #status { background: rgba(36,30,46,.88); color: #fffaee; opacity: 1; padding: 3px 9px; border-radius: 2px; }
    #status:empty { display: none; }
    #help { z-index: 7; pointer-events: auto; opacity: 1; color: var(--paper); text-shadow: none; right: calc(max(12px, env(safe-area-inset-right)) + 64px); }
    #help summary { width: fit-content; margin-left: auto; padding: 4px 10px; cursor: pointer; background: #383043; border-radius: 2px; }
    #help[open] { max-width: min(370px,65vw); padding: 9px 12px; line-height: 1.8; background: #383043; text-align: left; }
    body.touch #help { top: 47px; left: max(14px, env(safe-area-inset-left)); right: auto; text-align: left; }

    #loading .pskip { color: var(--ink); opacity: 1; font-size: 15px; padding: 6px 16px; }

    #medbox .book .C-room:has(.C-here) { border-color: #80518d; }

<body>
  <div id="stage"></div>
  <div id="status"></div>
  <div id="loading"><div class="card paper">
    <h1>怪化猫 · 游览</h1>
    <div class="where">正在加载</div>
    <div class="bar"><i></i></div>
    <div class="meta"><span class="step">准备中…</span><span class="mb"></span></div>
    <div class="big"></div>
    <div class="note">第一次进入要准备场景和人物，稍等片刻；之后再来会快很多。<span class="wifi">手机建议连 Wi-Fi。</span></div>
    <div class="tip"></div>
  </div></div>
  <script>
    // 加载提示：程序还没下完时先用这段小脚本显示地点名和轮播提示（tour/loading.js 之后接手进度）
    (function () {
      var L = document.getElementById("loading"), loc = new URLSearchParams(location.search).get("loc");
      var names = { ooku: "大奥", wanya: "万屋", sakai: "坂井家", fuenokouji: "笛小路家", solaris: "そらりす丸", subway: "地下铁", prison: "牢房" }, touch = matchMedia("(pointer: coarse)").matches || /[?&]touch=1/.test(location.search);
      L.querySelector(".where").textContent = loc ? "正在进入「" + (names[loc] || loc) + "」" : "正在展开绘卷";
      if (!touch) L.querySelector(".wifi").remove();
      var tips = touch
        ? ["左下角按住拖动就能走，推到底走得快", "右下角的摇杆转镜头，两根手指缩放", "看到「観」点一下，会走过去打开说明卡", "点「拔剑」，药郎会拔出退魔之剑", "点朱红的「拍照」存图，右上角「滤镜」换夜色、雨、褪色", "右上角「音」可以开关声音"]
        : ["点地面，药郎就走过去；也可以用 WASD，按住 Shift 快走", "看到「観」点一下，会走过去打开说明卡", "拖动转镜头，滚轮拉远拉近", "按 X，药郎会拔出退魔之剑", "P 拍照，F 换滤镜（夜色、雨、褪色），O 换姿势", "右上角「音」或按 B 开关声音"];
      var i = Math.floor(Math.random() * tips.length), el = L.querySelector(".tip");
      function show() { el.style.opacity = 0; setTimeout(function () { el.innerHTML = "<b>小提示</b>" + tips[i++ % tips.length]; el.style.opacity = 1; }, 300); }
      show(); setInterval(show, 4000);
    })();
  </script>
  <button id="snd" title="声音开关（B）">声音</button>
  <button id="mkbtn" title="物怪出没：开">物怪</button>
  <button id="boxbtn" title="药箱：斩过的物怪和执念物（I）">药箱</button>
  <div id="medbox" role="dialog" aria-label="药箱"><div class="mb-box"><div class="mb-count"></div><button class="mb-book" aria-label="翻开案卷">案卷</button><button class="mb-x" aria-label="关上药箱">×</button><div class="mb-grid"></div></div><div class="mb-tray"></div></div>
  <div id="mkink"></div>
  <div id="mk"></div>
  <details id="help"><summary>操作</summary><span class="keys">WASD / ↑↓←→ · Shift<br>点地面走 · 拖动转镜头 · 滚轮远近 · E 看说明 · T 放天秤 · P 拍照 · F 换滤镜 · O 换姿势 · X 拔剑 · M 总地图 · B 声音 · 物怪出没时 J 投札、空格闪避、K 跳、L 瞬移 · I 药箱</span><span class="fingers">左边摇杆走路 · 右边摇杆转视角 · 两指缩放</span></details>
  <div id="look"><div class="knob">视角</div></div>
  <div id="pad"><button class="b-sword" data-k="KeyX">拔剑</button><button class="b-photo" data-k="KeyP">拍照</button><button class="b-pose" data-k="KeyO">姿势</button><button class="b-scale" data-k="KeyT">秤</button><button class="b-ofuda" data-k="KeyJ">札</button><button class="b-dodge" data-k="Space">闪</button><button class="b-jump" data-k="KeyK">跳</button><button class="b-blink" data-k="KeyL">瞬</button><button class="b-filter" data-k="KeyF">滤镜</button><button class="b-map" data-k="KeyM">地图</button></div>
  <div id="stick"><div class="base"><div class="knob"></div></div></div>
  <div id="fx"></div>
  <div id="tags"></div>
  <div id="prompt" class="paper"></div>
  <div id="toast" class="paper"></div>
  <div id="card" class="paper"><div class="place"></div><div class="title"></div><div class="body"></div></div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div id="map"><h1>怪化猫 · 游览</h1><div class="hint">拖动或滚轮看长卷，点亮着的地点进去</div><div class="scroll"><div class="roll"><div class="rod"></div><div class="paper-roll"><img alt="绘卷总地图"></div><div class="rod"></div></div></div><div class="tests"></div></div>
  <!-- 访问统计（GoatCounter，duami.goatcounter.com）：不用 cookie；页面路径由 tour.js 自己报（no_onload），开发时（localhost）不报 -->
  <script data-goatcounter="https://duami.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="https://gc.zgo.at/count.js"></script>
  <script type="module" src="/src/tour/tour.js"></script>
</body>
</html>
